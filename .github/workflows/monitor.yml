name: 豆瓣高分监控

on:
  # 模式 B（本地 + GitHub 双跑兜底）：本地早上跑，GitHub 晚上跑。
  # 每天北京时间 21:00 定时（GitHub cron 用 UTC，21:00 CST = 13:00 UTC），作为国内本地早间运行的兜底。
  # 注意：境外 runner 抓豆瓣受机房 IP 限流影响，成功率不稳定。
  schedule:
    - cron: '0 13 * * *'   # 北京时间 21:00
  workflow_dispatch: # 手动触发（境外 runner 实测有时能抓豆瓣，但机房 IP 限流不稳定，稳定定时抓取由国内 Docker 负责）

# 共享持久化队列和每日预算的任务必须串行，运行中任务不被新任务取消。
concurrency:
  group: douban-monitor-data
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: 配置数据提交身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # monitor.py 负责唯一一次同步和提交；拉取失败时不会继续提交旧状态。
      - name: 运行监控
        run: python scripts/monitor.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
